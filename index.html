<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tummy-Time Aquarium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --panel-bg: rgba(10, 28, 48, 0.95);
    --panel-fg: #eef7ff;
    --panel-muted: #a9c3da;
    --accent: #ffcf5c;
    --accent-ink: #2b1d00;
    --control: #1f3d5c;
    --ok: #9ff0c4;
    --warn: #ffb3a7;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  #stage, #water { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #water { pointer-events: none; }
  body.clean #stage { cursor: none; }
  video { display: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  #fade.on { opacity: 1; }

  #panel { position: fixed; top: 14px; left: 14px; width: 320px; max-height: calc(100vh - 28px);
    overflow: auto; background: var(--panel-bg); color: var(--panel-fg); border-radius: 16px;
    padding: 16px 18px; font-size: 14px; line-height: 1.4; box-shadow: 0 10px 40px rgba(0,0,0,.45);
    box-sizing: border-box; }
  body.clean #panel { display: none; }
  /* While calibrating, park the panel in the middle so all four corner dots stay visible */
  body.calibrating #panel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 380px; }
  body.calibrating #panel .hide-when-cal { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #panel h1 { font-size: 18px; margin: 0; }
  #langBtn { width: auto; margin: 0; padding: 4px 10px; font-size: 12px; }
  #panel h2 { font-size: 13px; margin: 18px 0 6px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type=date], select { background: var(--control); color: var(--panel-fg); border: 0; border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 13px; }
  select { max-width: 160px; }
  button { width: 100%; margin-top: 8px; padding: 10px 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; cursor: pointer; }
  button.big { font-size: 17px; padding: 14px; }
  button.secondary { background: var(--control); color: var(--panel-fg); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #preview { width: 100%; border-radius: 8px; background: #111; display: block; margin-top: 10px; cursor: crosshair; }
  #status { margin-top: 8px; font-size: 13px; color: var(--ok); min-height: 1.4em; }
  #status.warn { color: var(--warn); }
  .hint { color: var(--panel-muted); font-size: 12px; margin: 4px 0; }

  .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .scenes button { margin: 0; padding: 10px 4px 8px; background: var(--control); color: var(--panel-fg);
    font-weight: 600; font-size: 12px; line-height: 1.2; border: 2px solid transparent; }
  .scenes button .ico { display: block; font-size: 28px; margin-bottom: 4px; }
  .scenes button[aria-pressed=true] { border-color: var(--accent); background: #2b4f75; }

  .age { display: flex; align-items: center; gap: 12px; }
  .age input { flex: 1; width: auto; }
  #ageVal { font-weight: 700; min-width: 76px; text-align: right; }

  details { margin-top: 18px; border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px; }
  summary { cursor: pointer; color: var(--panel-muted); font-size: 13px; }
  details h2 { margin-top: 14px !important; }
  #meter { height: 8px; background: var(--control); border-radius: 4px; position: relative; overflow: hidden; margin: 4px 0 2px; }
  #meterFill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); transition: width 60ms linear; }
  #meterMark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--warn); }
  kbd { background: var(--control); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  /* Small gear that shows up when someone moves the mouse while the panel is hidden */
  #menuBtn { position: fixed; top: 14px; left: 14px; width: auto; margin: 0; padding: 10px 14px; font-size: 20px;
    background: rgba(10,28,48,.8); color: #fff; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.clean.mouse-awake #menuBtn { opacity: 1; pointer-events: auto; }
  body:not(.clean) #menuBtn { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="video" playsinline muted></video>
<div id="fade"></div>
<button id="menuBtn" aria-label="Menu">⚙︎</button>

<div id="panel">
  <div class="top">
    <h1>🐠 Tummy-Time</h1>
    <button id="langBtn" class="secondary">ES</button>
  </div>

  <div class="hide-when-cal">
    <button id="startBtn" class="big" data-t="start"></button>
  </div>
  <canvas id="preview" width="320" height="180" aria-label="Camera preview"></canvas>
  <div id="status"></div>

  <div class="hide-when-cal">
    <h2 data-t="scene"></h2>
    <div class="scenes" id="scenes"></div>
    <p class="hint" data-t="sceneHint"></p>

    <h2 data-t="age"></h2>
    <div class="age"><input type="range" id="ageMonths" min="0" max="24" step="1"><span id="ageVal"></span></div>
    <p class="hint" id="ageHint"></p>

    <h2 data-t="sound"></h2>
    <div class="age"><span>🔈</span><input type="range" id="volume" min="0" max="1" step="0.05"><span>🔊</span></div>
  </div>

  <button id="calBtn" class="secondary" data-t="lineUp"></button>
  <p class="hint" id="calHint"></p>

  <div class="hide-when-cal">
    <button id="goBtn" data-t="go"></button>
    <p class="hint" data-t="goHint"></p>

    <details>
      <summary data-t="advanced"></summary>

      <h2 data-t="camera"></h2>
      <label><span data-t="whichCamera"></span> <select id="cameraSel"><option value=""></option></select></label>
      <label><span data-t="mirror"></span> <input type="checkbox" id="mirror"></label>
      <button id="clearCalBtn" class="secondary" data-t="clearCal"></button>

      <h2 data-t="animals"></h2>
      <label><span data-t="howMany"></span> <input type="range" id="fishCount" min="3" max="30" step="1"></label>
      <label><span data-t="size"></span> <input type="range" id="fishSize" min="0.5" max="2" step="0.05"></label>
      <label><span data-t="reach"></span> <input type="range" id="reach" min="0.15" max="0.9" step="0.01"></label>
      <label><span data-t="speed"></span> <input type="range" id="speed" min="0.4" max="2" step="0.05"></label>
      <label><span data-t="autoScene"></span>
        <select id="autoScene"><option value="0"></option><option value="2"></option><option value="5"></option><option value="10"></option></select></label>
      <label><span data-t="birthday"></span> <input type="date" id="birthday"></label>

      <h2 data-t="slap"></h2>
      <label><span data-t="slapThresh"></span> <input type="range" id="slapThresh" min="2" max="25" step="0.5"></label>
      <div id="meter"><div id="meterFill"></div><div id="meterMark"></div></div>
      <p class="hint" data-t="slapHint"></p>

      <h2 data-t="look"></h2>
      <label><span data-t="glow"></span> <input type="range" id="bgGlow" min="0" max="1" step="0.05"></label>
      <label><span data-t="handGlow"></span> <input type="checkbox" id="handGlow"></label>
      <label><span data-t="gpu"></span> <input type="checkbox" id="gpuWater"></label>
      <label><span data-t="showDots"></span> <input type="checkbox" id="showDots"></label>

      <p class="hint" style="margin-top:14px" data-t="keys"></p>
    </details>
  </div>
</div>


<script type="module">
// Scenes live in the scenes/ folder, one file each (see scenes/README.md). This file is the engine:
// settings and panel, camera and hand tracking, the shared animal behaviour, food, particles, sound and the GPU layer.

// ---------- Settings ----------
const DEFAULTS = {
  fishCount: 9, fishSize: 1, reach: 0.45, speed: 1, slapThresh: 9,
  bgGlow: 0.55, handGlow: true, showDots: false, volume: 0.5, mirror: true,
  calib: null, // { cam: [[x,y]x4 normalized], proj: [[x,y]x4 normalized] }
  cameraId: '',
  ageMonths: 10, birthday: '', gpuWater: true, scene: 'pond', autoScene: 0,
  lang: (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en',
};
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('tummyAquarium') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('tummyAquarium', JSON.stringify(S)); } catch {} };

const $ = id => document.getElementById(id);
const stage = $('stage'), ctx = stage.getContext('2d');
const preview = $('preview'), pctx = preview.getContext('2d');
const video = $('video');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- Words (English / Spanish) ----------
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const I18N = {
  en: {
    start: '1 · ▶ Start camera', restart: '1 · ↻ Restart camera', scene: 'Scene', age: "Baby's age", sound: 'Sound',
    sceneHint: 'Hand still for a moment → food appears. Slap → they swim away.',
    months: n => plural(n, 'month', 'months'),
    lineUp: '2 · 🎯 Line up camera & projector', cancel: 'Cancel',
    go: '3 · ⛶ Full screen', goHint: 'Hides this panel. Move the mouse and click ⚙︎ to bring it back.',
    advanced: 'Advanced settings', camera: 'Camera', whichCamera: 'Which camera', defaultCam: 'Default',
    mirror: 'Mirror (when not lined up)', clearCal: 'Forget line-up',
    animals: 'Animals', howMany: 'How many', size: 'Size', reach: 'How far they come', speed: 'Speed',
    autoScene: 'Change scene', never: 'Never', everyMin: n => `Every ${n} min`, birthday: 'Birthday (age updates itself)',
    slap: 'Slap detection', slapThresh: 'Slap strength needed',
    slapHint: 'Green bar = hand movement now. A slap fires when it crosses the red line. Raise it if the animals run away when baby is only reaching.',
    look: 'Look', glow: 'Background light', handGlow: 'Light under hand', gpu: 'Realistic effects (GPU)', showDots: 'Show hand dots',
    keys: '<kbd>H</kbd> hide panel · <kbd>F</kbd> full screen · <kbd>N</kbd> next scene · <kbd>C</kbd> line up · <kbd>Esc</kbd> cancel',
    idle: 'Try it with the mouse: move = hand, hold still = food, click = slap.',
    noScenes: 'No scenes found. Start the app with the local server (see README).',
    loading: 'Loading hand tracker…',
    readyCal: 'Ready ✓ Watching for hands. Press Full screen.',
    readyNoCal: 'Watching for hands ✓ Next: Line up camera & projector.',
    camFail: e => `The camera didn't start: ${e}`,
    calFirst: 'Start the camera first.',
    dots: ['1 (red)', '2 (yellow)', '3 (blue)', '4 (green)'],
    calClick: d => `Coloured dots are on the floor now. In the camera picture, click the centre of dot ${d}.`,
    calBad: "Those points didn't work. Try again.", calDone: 'Lined up ✓ Put your hand on the blanket to check.',
    calCancel: 'Line-up cancelled.', calCleared: 'Line-up forgotten.',
    calYes: '✓ Lined up: animals go to real hands.', calNo: 'Not lined up yet. Do this once after placing the camera and projector.',
    gpuFail: 'This computer cannot do the realistic effects; using the simple ones.',
    stageNames: ['High contrast: black, white & red', 'Bold, simple colours', 'Full colour', 'Rainbow: lots of colours'],
  },
  es: {
    start: '1 · ▶ Encender cámara', restart: '1 · ↻ Reiniciar cámara', scene: 'Escenario', age: 'Edad del bebé', sound: 'Sonido',
    sceneHint: 'Mano quieta un momento → aparece comida. Golpe → se van nadando.',
    months: n => plural(n, 'mes', 'meses'),
    lineUp: '2 · 🎯 Alinear cámara y proyector', cancel: 'Cancelar',
    go: '3 · ⛶ Pantalla completa', goHint: 'Oculta este panel. Mueve el mouse y haz clic en ⚙︎ para volver.',
    advanced: 'Ajustes avanzados', camera: 'Cámara', whichCamera: 'Cuál cámara', defaultCam: 'Predeterminada',
    mirror: 'Espejo (si no está alineado)', clearCal: 'Olvidar alineación',
    animals: 'Animales', howMany: 'Cuántos', size: 'Tamaño', reach: 'Qué tan lejos vienen', speed: 'Velocidad',
    autoScene: 'Cambiar escenario', never: 'Nunca', everyMin: n => `Cada ${n} min`, birthday: 'Cumpleaños (la edad se actualiza sola)',
    slap: 'Detección de golpe', slapThresh: 'Fuerza de golpe necesaria',
    slapHint: 'Barra verde = movimiento de la mano ahora. Cuenta como golpe al pasar la línea roja. Súbela si los animales huyen cuando el bebé solo estira la mano.',
    look: 'Apariencia', glow: 'Luz del fondo', handGlow: 'Luz bajo la mano', gpu: 'Efectos realistas (GPU)', showDots: 'Mostrar puntos de la mano',
    keys: '<kbd>H</kbd> ocultar panel · <kbd>F</kbd> pantalla completa · <kbd>N</kbd> siguiente escenario · <kbd>C</kbd> alinear · <kbd>Esc</kbd> cancelar',
    idle: 'Prueba con el mouse: moverlo = mano, dejarlo quieto = comida, clic = golpe.',
    noScenes: 'No se encontraron escenarios. Abre la app con el servidor local (ver README).',
    loading: 'Cargando el detector de manos…',
    readyCal: 'Listo ✓ Buscando manos. Presiona Pantalla completa.',
    readyNoCal: 'Buscando manos ✓ Siguiente: Alinear cámara y proyector.',
    camFail: e => `La cámara no encendió: ${e}`,
    calFirst: 'Primero enciende la cámara.',
    dots: ['1 (rojo)', '2 (amarillo)', '3 (azul)', '4 (verde)'],
    calClick: d => `Ya hay puntos de colores en el piso. En la imagen de la cámara, haz clic en el centro del punto ${d}.`,
    calBad: 'Esos puntos no funcionaron. Intenta otra vez.', calDone: 'Alineado ✓ Pon tu mano en la cobija para probar.',
    calCancel: 'Alineación cancelada.', calCleared: 'Alineación olvidada.',
    calYes: '✓ Alineado: los animales van a las manos reales.', calNo: 'Aún no está alineado. Hazlo una vez después de colocar la cámara y el proyector.',
    gpuFail: 'Esta computadora no puede con los efectos realistas; uso los sencillos.',
    stageNames: ['Alto contraste: negro, blanco y rojo', 'Colores fuertes y sencillos', 'A todo color', 'Arcoíris: muchos colores'],
  },
};
const T = () => I18N[S.lang] || I18N.en;
let lastStatus = ['idle', false, []];
function setStatus(key, warn = false, ...args) {
  lastStatus = [key, warn, args];
  const v = T()[key], s = $('status');
  s.textContent = typeof v === 'function' ? v(...args) : (v ?? key);
  s.classList.toggle('warn', warn);
}
function applyLang() {
  const t = T();
  document.documentElement.lang = S.lang;
  for (const el of document.querySelectorAll('[data-t]')) {
    const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v;
  }
  $('langBtn').textContent = S.lang === 'es' ? 'EN' : 'ES';
  $('startBtn').textContent = video.srcObject ? t.restart : t.start;
  if (calibrating) $('calBtn').textContent = t.cancel;
  for (const o of $('autoScene').options) o.textContent = o.value === '0' ? t.never : t.everyMin(+o.value);
  if ($('cameraSel').options[0]?.value === '') $('cameraSel').options[0].textContent = t.defaultCam;
  buildSceneButtons(); updateAgeText(); rebuildHomography(); setStatus(lastStatus[0], lastStatus[1], ...lastStatus[2]);
}
$('langBtn').addEventListener('click', () => { S.lang = S.lang === 'es' ? 'en' : 'es'; save(); applyLang(); });

// ---------- Canvas sizing ----------
let critters = [];
let W = 0, H = 0, DPR = 1, UNIT = 1; // UNIT = min(W,H), used to size everything
let layoutTimer = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const wasEmpty = UNIT < 2;
  W = window.innerWidth; H = window.innerHeight; UNIT = Math.min(W, H);
  // If the page loaded while hidden (zero size), everything spawned at 0,0: spread it out now
  if (wasEmpty && UNIT >= 2) for (const f of critters) { f.x = rand(0.15, 0.85) * W; f.y = rand(0.15, 0.85) * H; }
  stage.width = Math.round(W * DPR); stage.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // let the scene redraw its decorations at the new size, once resizing settles
  clearTimeout(layoutTimer); layoutTimer = setTimeout(() => SCENE?.decor?.layout?.(), 150);
}
window.addEventListener('resize', resize); resize();

// ---------- Homography (camera -> projector) ----------
function solveHomography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  // Gaussian elimination with partial pivoting
  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-12) return null;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  return [...b.map((v, i) => v / A[i][i]), 1];
}
let Hmat = null;
function rebuildHomography() {
  Hmat = S.calib ? solveHomography(S.calib.cam, S.calib.proj) : null;
  $('calHint').textContent = Hmat ? T().calYes : T().calNo;
}
// normalized camera coords -> screen px
function camToScreen(cx, cy) {
  if (Hmat) {
    const h = Hmat, d = h[6] * cx + h[7] * cy + h[8];
    return [((h[0] * cx + h[1] * cy + h[2]) / d) * W, ((h[3] * cx + h[4] * cy + h[5]) / d) * H];
  }
  return [(S.mirror ? 1 - cx : cx) * W, cy * H];
}

// ---------- Calibration ----------
const CAL_INSET = 0.1;
const CAL_PROJ = [[CAL_INSET, CAL_INSET], [1 - CAL_INSET, CAL_INSET], [1 - CAL_INSET, 1 - CAL_INSET], [CAL_INSET, 1 - CAL_INSET]];
const CAL_COLORS = ['#ff4d4d', '#ffd23f', '#3fd0ff', '#7dff6a'];
let calibrating = false, calClicks = [];
function startCalibration() {
  if (!video.srcObject) { setStatus('calFirst', true); return; }
  calibrating = true; calClicks = [];
  document.body.classList.add('calibrating'); document.body.classList.remove('clean');
  $('calBtn').textContent = T().cancel;
  setStatus('calClick', false, T().dots[0]);
}
function endCalibration() {
  calibrating = false; document.body.classList.remove('calibrating');
  $('calBtn').textContent = T().lineUp;
}
preview.addEventListener('click', e => {
  if (!calibrating) return;
  const r = preview.getBoundingClientRect();
  calClicks.push([(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]);
  if (calClicks.length < 4) { setStatus('calClick', false, T().dots[calClicks.length]); return; }
  const cal = { cam: calClicks, proj: CAL_PROJ };
  if (!solveHomography(cal.cam, cal.proj)) { setStatus('calBad', true); endCalibration(); return; }
  S.calib = cal; save(); rebuildHomography(); endCalibration();
  setStatus('calDone');
});
$('calBtn').addEventListener('click', () => {
  if (calibrating) { endCalibration(); setStatus('calCancel'); } else startCalibration();
});
$('clearCalBtn').addEventListener('click', () => { S.calib = null; save(); rebuildHomography(); setStatus('calCleared'); });

// ---------- Sound ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
// A pitch sweep ("bloop"), good for water
function bloop(freqStart, freqEnd, dur, vol, delay = 0) {
  const a = audio(); if (!a || S.volume <= 0) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freqStart, t);
  o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol * S.volume, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
// A soft bell
function bell(freq, dur, vol, delay = 0) {
  const a = audio(); if (!a || S.volume <= 0) return;
  const t = a.currentTime + delay;
  for (const [mult, v] of [[1, 1], [2.01, 0.25], [3.02, 0.08]]) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * mult, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * v * S.volume, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mult);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
}
// Pentatonic notes always sound nice together, whatever order baby plays them in
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];

// ---------- Age stages ----------
// Newborns see strong contrast best (black, white, then red), colour vision fills in over the first months,
// and toddlers enjoy lots of different colours. Each scene has a look for each stage.
const STAGE_UP_TO = [3, 6, 12, Infinity];
function ageNow() {
  if (S.birthday) {
    const b = new Date(S.birthday + 'T00:00'), n = new Date();
    if (!isNaN(b)) return Math.max(0, (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth() - (n.getDate() < b.getDate() ? 1 : 0));
  }
  return S.ageMonths;
}

        float t = uTime * (1.0 - 3.5 / float(n + 1));
        i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
        c += 1.0 / length(vec2(p.x / (sin(i.x + t) / 0.005), p.y / (cos(i.y + t) / 0.005)));

    ${sc.shader?.functions || ''}
    void main() {
      float h0 = texture2D(uState, vUv).r;
      float hL = texture2D(uState, vUv - vec2(uTexel.x, 0.0)).r, hR = texture2D(uState, vUv + vec2(uTexel.x, 0.0)).r;
      float hD = texture2D(uState, vUv - vec2(0.0, uTexel.y)).r, hU = texture2D(uState, vUv + vec2(0.0, uTexel.y)).r;

  let SW = 1, SH = 1, rtA = null, rtB = null;
  const drops = [];
  function resizeGpu() {
    renderer.setPixelRatio(Math.min(DPR, 1.5));
    renderer.setSize(W, H, false);

    renderer.setRenderTarget(null);
    simMat.uniforms.uTexel.value.set(1 / SW, 1 / SH); viewUniforms.uTexel.value.set(1 / SW, 1 / SH);

  window.addEventListener('resize', resizeGpu);   // registered after resize(), so the 2D canvas is already the new size

  function step(withDrops) {
    const u = simMat.uniforms;
    u.uState.value = rtA.texture;
    u.uDropCount.value = 0;
    if (withDrops) {
      const n = Math.min(MAX_DROPS, drops.length);
      for (let i = 0; i < n; i++) u.uDrops.value[i].set(...drops[i]);
      u.uDropCount.value = n; drops.length = 0;
    }
    quad.material = simMat;
    renderer.setRenderTarget(rtB); renderer.render(scene, cam);
    [rtA, rtB] = [rtB, rtA];
  }
  return {
    canvas,
    // x, y, radius in screen px; strength > 0 lifts the surface, < 0 pushes it down
    drop(x, y, radius, strength) {
      if (Math.abs(strength) < 1e-5) return;
      const d = [x / W, 1 - y / H, radius / Math.max(1, H), strength];
      if (Math.abs(strength) > 0.1) drops.unshift(d); else if (drops.length < MAX_DROPS) drops.push(d);   // slaps always get in
    },
    render(t) {
      step(true); step(false);
      const u = viewUniforms;
      u.uState.value = rtA.texture; u.uFish.value = fishTex;
      u.uTime.value = t * 0.3 + 23; u.uT.value = t; u.uGlow.value = S.bgGlow;
      u.uBg.value.set(...LOOK.bg); u.uLight.value.set(...(LOOK.light || LOOK.bg));

}
let useGpu = false;
// push the water (or whatever the scene's surface is) at x, y
function wave(x, y, radius, strength) { if (useGpu && SCENE.waves) gpu.drop(x, y, radius, strength); }

// ---------- Scenes ----------
// Everything a scene file can use
const api = {
  get W() { return W; }, get H() { return H; }, get UNIT() { return UNIT; }, get DPR() { return DPR; },
  get S() { return S; }, get LOOK() { return LOOK; }, get stage() { return stageIndex(); }, get scene() { return SCENE; },
  ctx, rand, pick, Critter, foods, wave, spawnParticles, glowSprite, gradient, caustics,
  sounds: { bloop, bell, PENTA },
};
const SCENES = new Map();
let SCENE = null, LOOK = null;
// Loads every .js file in scenes/ (files starting with _ are skipped). The folder listing comes from the
// local server; on hosts that don't list folders, scenes/index.json names the files instead.
async function loadScenes() {
  let files = [];
  try {
    const res = await fetch('scenes/', { cache: 'no-store' });
    if (res.ok) files = [...(await res.text()).matchAll(/href="([^"?#/]+\.js)"/g)].map(m => decodeURIComponent(m[1]));
  } catch {}
  if (!files.length) try { files = await (await fetch('scenes/index.json', { cache: 'no-store' })).json(); } catch {}
  files = [...new Set(files)].filter(f => !f.startsWith('_'));
  const loaded = await Promise.all(files.map(async f => {
    try {
      const sc = (await import(`./scenes/${f}`)).default(api);
      sc.id ||= f.replace(/\.js$/, '');
      return sc;
    } catch (e) { console.warn(`Scene ${f} could not load:`, e); return null; }
  }));
  for (const sc of loaded.filter(Boolean).sort((a, b) => (a.order ?? 99) - (b.order ?? 99))) SCENES.set(sc.id, sc);
}

function spawnCritters() {
  const n = S.fishCount;
  critters = SCENE.spawn ? SCENE.spawn(n) : Array.from({ length: n }, () => new SCENE.Critter(pick(LOOK.looks)));
}
// Rebuild everything after a scene or age change
function applyScene() {
  SCENE = SCENES.get(S.scene) || SCENES.values().next().value;
  LOOK = SCENE.stages[Math.min(stageIndex(), SCENE.stages.length - 1)];
  foods.length = 0; particles.length = 0; ripples.length = 0;
  spawnCritters();
  SCENE.decor?.init?.();
  for (const b of document.querySelectorAll('#scenes button')) b.setAttribute('aria-pressed', String(b.dataset.id === SCENE.id));
}
function buildSceneButtons() {
  const box = $('scenes'); box.innerHTML = '';
  for (const sc of SCENES.values()) {
    const b = document.createElement('button');
    b.dataset.id = sc.id; b.setAttribute('aria-pressed', String(sc === SCENE));
    b.innerHTML = `<span class="ico">${sc.icon || '✨'}</span>${sc.name?.[S.lang] || sc.name?.en || sc.id}`;
    b.addEventListener('click', () => switchScene(sc.id));

}
// Fade to black, swap, fade back in
let switching = false, lastSwitch = performance.now();
function switchScene(id) {
  if (switching || id === SCENE?.id || !SCENES.has(id)) return;
  switching = true; lastSwitch = performance.now();
  $('fade').classList.add('on');
  setTimeout(() => {
    S.scene = id; save(); applyScene();
    $('fade').classList.remove('on'); switching = false;
  }, 600);
}
const sceneIds = () => [...SCENES.keys()];
const nextScene = () => { const ids = sceneIds(); switchScene(ids[(ids.indexOf(SCENE.id) + 1) % ids.length]); };

function updateAgeText() {
  const age = ageNow();
  $('ageMonths').value = Math.min(24, age); $('ageMonths').disabled = !!S.birthday;

// ---------- Hands ----------
// A "hand" (from camera or mouse): { x, y (screen px, smoothed), r (screen px radius), energy }
let tracks = [];          // camera hand tracks
let mouseHand = null;     // mouse test hand
let meterLevel = 0;
function handsNow(now) {
  const list = tracks.filter(t => now - t.seen < 250);
  if (mouseHand && now - mouseHand.seen < 10000) list.push(mouseHand);   // a resting mouse counts as a resting hand
  return list;
}
function updateTracks(results, now) {
  const dets = [];
  for (const lm of results.landmarks || []) {
    // palm centre = mean of wrist + 4 knuckles; size = wrist to middle knuckle
    const idx = [0, 5, 9, 13, 17];
    let cx = 0, cy = 0; for (const i of idx) { cx += lm[i].x; cy += lm[i].y; } cx /= 5; cy /= 5;
    const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
    const size = Math.hypot((lm[9].x - lm[0].x) * vw, (lm[9].y - lm[0].y) * vh);
    dets.push({ cx, cy, size, lm });
  }
  const used = new Set();
  for (const d of dets) {
    let best = null, bd = 0.25;
    for (const t of tracks) { if (used.has(t)) continue; const dd = Math.hypot(t.cx - d.cx, t.cy - d.cy); if (dd < bd) { bd = dd; best = t; } }
    if (!best) { best = { hist: [], energy: 0, cooldown: 0, x: 0, y: 0, r: 0, fresh: true }; tracks.push(best); }
    used.add(best);
    Object.assign(best, { cx: d.cx, cy: d.cy, size: d.size, lm: d.lm, seen: now });
    // screen position (smoothed)
    const [sx, sy] = camToScreen(d.cx, d.cy);
    const [ex, ey] = camToScreen(d.lm[9].x, d.lm[9].y), [wx, wy] = camToScreen(d.lm[0].x, d.lm[0].y);
    const r = Math.max(UNIT * 0.04, Math.hypot(ex - wx, ey - wy) * 1.1);
    if (best.fresh) { best.x = sx; best.y = sy; best.r = r; best.fresh = false; if (SCENE?.waves) ripples.push({ x: sx, y: sy, age: 0, size: 0.4 }); }
    else { best.x += (sx - best.x) * 0.5; best.y += (sy - best.y) * 0.5; best.r += (r - best.r) * 0.3; }
    // slap energy: speed in hand-lengths per second, plus how fast the hand grows/shrinks (moving toward/away from camera)
    const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
    best.hist.push({ t: now, x: d.cx * vw, y: d.cy * vh, s: d.size });
    while (best.hist.length > 2 && now - best.hist[0].t > 120) best.hist.shift();
    const a = best.hist[0], b = best.hist[best.hist.length - 1], dt = (b.t - a.t) / 1000;
    if (dt > 0.03 && a.s > 2 && b.s > 2) {
      const planar = Math.hypot(b.x - a.x, b.y - a.y) / ((a.s + b.s) / 2) / dt;
      const depth = Math.abs(Math.log(b.s / a.s)) / dt;
      best.energy = planar + 4 * depth;
    } else best.energy = 0;
    if (best.energy > S.slapThresh && now > best.cooldown) {
      best.cooldown = now + 600;
      splash(best.x, best.y);
    }
  }
  tracks = tracks.filter(t => now - t.seen < 400);
  const e = Math.max(0, ...tracks.map(t => t.energy || 0));
  meterLevel = Math.max(e, meterLevel * 0.85);
}

// Mouse test: move = hand, hold still = food, click = slap
let mouseTimer = 0;
stage.addEventListener('pointermove', e => {
  const now = performance.now();
  if (!mouseHand) mouseHand = { x: e.clientX, y: e.clientY, r: UNIT * 0.06, energy: 0 };
  mouseHand.x = e.clientX; mouseHand.y = e.clientY; mouseHand.seen = now;
  // show the ⚙︎ button for a few seconds while the panel is hidden
  document.body.classList.add('mouse-awake');
  clearTimeout(mouseTimer); mouseTimer = setTimeout(() => document.body.classList.remove('mouse-awake'), 2500);
});
stage.addEventListener('pointerdown', e => { audio(); splash(e.clientX, e.clientY); });
stage.addEventListener('pointerleave', () => { mouseHand = null; });

// ---------- Camera + MediaPipe ----------
let landmarker = null, lastVideoTime = -1;
async function loadLandmarker() {
  setStatus('loading');
  const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const opts = delegate => ({
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
    runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: 0.35, minHandPresenceConfidence: 0.35, minTrackingConfidence: 0.35,
  });
  try { landmarker = await HandLandmarker.createFromOptions(files, opts('GPU')); }
  catch { landmarker = await HandLandmarker.createFromOptions(files, opts('CPU')); }
}
async function listCameras() {
  const sel = $('cameraSel');
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  sel.innerHTML = '';
  devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || `Camera ${i + 1}`; sel.appendChild(o); });
  if (S.cameraId && devs.some(d => d.deviceId === S.cameraId)) sel.value = S.cameraId;
}
async function startCamera() {
  audio();
  const btn = $('startBtn'); btn.disabled = true;
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    if (S.cameraId) constraints.video.deviceId = { exact: S.cameraId };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia(constraints); }
    catch { delete constraints.video.deviceId; stream = await navigator.mediaDevices.getUserMedia(constraints); }
    video.srcObject = stream; await video.play();
    await listCameras();
    const id = stream.getVideoTracks()[0].getSettings().deviceId; if (id) $('cameraSel').value = id;
    preview.height = Math.round(preview.width * video.videoHeight / video.videoWidth);
    if (!landmarker) await loadLandmarker();
    btn.textContent = T().restart;
    setStatus(S.calib ? 'readyCal' : 'readyNoCal');
  } catch (err) {
    console.error(err);
    setStatus('camFail', true, err.message || err);
  } finally { btn.disabled = false; }
}
$('startBtn').addEventListener('click', startCamera);
$('cameraSel').addEventListener('change', e => { S.cameraId = e.target.value; save(); if (video.srcObject) startCamera(); });

function detect(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  try { updateTracks(landmarker.detectForVideo(video, now), now); } catch (e) { console.warn(e); }
}

// ---------- Preview (camera view in panel) ----------
function drawPreview(now) {
  if (document.body.classList.contains('clean')) return;
  const pw = preview.width, ph = preview.height;
  if (video.readyState >= 2) pctx.drawImage(video, 0, 0, pw, ph);
  else { pctx.fillStyle = '#111'; pctx.fillRect(0, 0, pw, ph); pctx.fillStyle = '#789'; pctx.font = '28px system-ui'; pctx.textAlign = 'center'; pctx.fillText('📷', pw / 2, ph / 2 + 10); pctx.textAlign = 'start'; }
  for (const t of tracks) {
    if (now - t.seen > 250 || !t.lm) continue;
    pctx.fillStyle = t.energy > S.slapThresh ? '#ff5d5d' : '#7dffb0';
    for (const p of t.lm) { pctx.beginPath(); pctx.arc(p.x * pw, p.y * ph, 2.2, 0, Math.PI * 2); pctx.fill(); }
  }
  const pts = calibrating ? calClicks : (S.calib ? S.calib.cam : []);
  if (pts.length) {
    pctx.strokeStyle = '#ffcf5c'; pctx.lineWidth = 2; pctx.beginPath();
    pts.forEach(([x, y], i) => i ? pctx.lineTo(x * pw, y * ph) : pctx.moveTo(x * pw, y * ph));
    if (pts.length === 4) pctx.closePath(); pctx.stroke();
    pts.forEach(([x, y], i) => { pctx.fillStyle = CAL_COLORS[i]; pctx.beginPath(); pctx.arc(x * pw, y * ph, 5, 0, Math.PI * 2); pctx.fill(); });
  }
  const m = $('meterFill'), mark = $('meterMark'), maxE = 25;
  m.style.width = Math.min(100, meterLevel / maxE * 100) + '%';
  m.style.background = meterLevel > S.slapThresh ? 'var(--warn)' : 'var(--ok)';
  mark.style.left = (S.slapThresh / maxE * 100) + '%';
}
function drawCalibrationTargets() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath();
  CAL_PROJ.forEach(([x, y], i) => i ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H)); ctx.closePath(); ctx.stroke();
  CAL_PROJ.forEach(([x, y], i) => {
    const done = i < calClicks.length, r = UNIT * 0.035;
    ctx.fillStyle = CAL_COLORS[i]; ctx.globalAlpha = done ? 0.35 : 1;
    ctx.beginPath(); ctx.arc(x * W, y * H, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = `bold ${Math.round(r)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), x * W, y * H); ctx.globalAlpha = 1;
  });
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  detect(now);
  useGpu = !!(S.gpuWater && gpu);
  if (gpu) gpu.canvas.style.display = useGpu && !calibrating ? 'block' : 'none';
  if (calibrating) { drawCalibrationTargets(); drawPreview(now); requestAnimationFrame(frame); return; }
  if (S.autoScene > 0 && now - lastSwitch > S.autoScene * 60000) nextScene();
  const t = now / 1000, hands = handsNow(now);
  for (const h of hands) {
    h.speed = h._px == null ? 0 : Math.hypot(h.x - h._px, h.y - h._py) / Math.max(dt, 1e-3);
    h._px = h.x; h._py = h.y;
  }
  drawBackground(t, useGpu);
  SCENE.decor?.draw?.(ctx, t, dt, hands);
  if (SCENE.food?.layer !== 'over') for (const f of foods) SCENE.food.draw(ctx, f, t, dt);
  // Soft light under each hand: looks magical and also lights baby's hand so the camera sees it better
  for (const h of hands) {
    if (S.handGlow) {
      const r = Math.max(h.r * 2.2, UNIT * 0.1);
      const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r);
      g.addColorStop(0, 'rgba(255,240,200,0.35)'); g.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.fill();
    }
    if (Math.random() < dt * 2) spawnParticles(h.x + rand(-1, 1) * h.r, h.y + rand(-1, 1) * h.r, 1, 0.15);
  }
  updateFoods(dt, hands);
  for (const f of critters) f.update(dt, hands, critters);
  if (useGpu && SCENE.waves) {
    // Hands stir the surface as they move and make soft rings while resting; animals leave a small wake
    for (const h of hands) gpu.drop(h.x, h.y, Math.max(h.r * 0.8, UNIT * 0.03), -Math.min(0.12, h.speed / UNIT * 0.04) + 0.004 * Math.sin(t * 6));
    if (SCENE.wake) for (const f of critters) {
      const [hx, hy] = f.mouth();
      gpu.drop(hx, hy, Math.max(f.L * 0.12, UNIT * 0.01), (-0.004 * f.swim - (f.scared > 0 ? 0.008 : 0)) * SCENE.wake);
    }
  }
  // higher up = drawn on top
  const items = critters.map(f => [f, f.prepare()]).sort((a, b) => a[0].z - b[0].z);
  drawShadows(items);
  for (const [f, g] of items) f.draw(ctx, g);
  if (SCENE.food?.layer === 'over') for (const f of foods) SCENE.food.draw(ctx, f, t, dt);
  drawMotes(t);
  // ripples (in GPU mode they go into the wave simulation instead)
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.age += dt;
    if (r.age > 1.4) { ripples.splice(i, 1); continue; }
    const size = r.size || 1;
    if (useGpu) { if (!r.sent) { r.sent = true; gpu.drop(r.x, r.y, UNIT * 0.05 * size, -1.5 * size); } continue; }
    for (let k = 0; k < 4; k++) {
      const a = r.age - k * 0.14; if (a <= 0) continue;
      const rad = a * UNIT * 0.42 * size, fade = Math.max(0, 1 - a / 1.25) * (1 - k * 0.18);
      ctx.lineWidth = UNIT * 0.006 * size;
      ctx.strokeStyle = `rgba(0,10,20,${0.35 * fade})`;
      ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(0, rad - UNIT * 0.007 * size), 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(215,245,255,${0.55 * fade})`;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
    }
  }
  drawParticles(dt);
  if (S.showDots) for (const h of hands) {
    ctx.strokeStyle = '#ffcf5c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
  }
  if (useGpu) gpu.render(t);
  drawPreview(now);
  requestAnimationFrame(frame);
}

$('ageMonths').addEventListener('input', e => { S.ageMonths = +e.target.value; save(); updateAgeText(); applyScene(); });
$('birthday').addEventListener('change', e => { S.birthday = e.target.value; save(); updateAgeText(); applyScene(); });
$('autoScene').value = String(S.autoScene);
$('autoScene').addEventListener('change', e => { S.autoScene = +e.target.value; lastSwitch = performance.now(); save(); });

$('goBtn').addEventListener('click', () => {
  document.body.classList.add('clean');
  document.documentElement.requestFullscreen?.().catch(() => {});
});
$('menuBtn').addEventListener('click', () => {
  document.body.classList.remove('clean');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
});

window.addEventListener('keydown', e => {
  if (['SELECT', 'INPUT'].includes(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  const k = e.key.toLowerCase(), ids = sceneIds();
  if (k === 'h') document.body.classList.toggle('clean');
  else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'c') calibrating ? (endCalibration(), setStatus('calCancel')) : startCalibration();
  else if (k === 'n' && SCENE) nextScene();
  else if (/^[1-9]$/.test(k) && ids[+k - 1]) switchScene(ids[+k - 1]);
  else if (k === 'escape' && calibrating) { endCalibration(); setStatus('calCancel'); }
});

await loadScenes();
if (!SCENES.size) { applyLang(); setStatus('noScenes', true); }
else {
  applyScene();
  applyLang();
  if (S.gpuWater) initGpu();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
